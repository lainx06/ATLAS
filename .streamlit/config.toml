# ATLAS UI theme (docs/UI_SPEC.md §7). Native theming; the only CSS is views.CSS.

[browser]
gatherUsageStats = false  # no telemetry: the UI makes no outbound calls

[server]
headless = true
address = "localhost"  # local only; also skips Streamlit's external-IP lookup at startup
runOnSave = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#F5F5F4"
textColor = "#1C1917"
borderColor = "#E7E5E4"
linkColor = "#1D4ED8"
codeBackgroundColor = "#F5F5F4"
codeTextColor = "#1C1917"
# Streamlit's bundled faces (served locally, no web-font fetch; UI_SPEC §12).
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
codeFontSize = "13px"
headingFontSizes = ["22px", "18px", "16px", "15px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
# Status colours (meaning only; always printed with their code).
redColor = "#B91C1C"
greenColor = "#15803D"
orangeColor = "#B45309"
violetColor = "#7E22CE"
grayColor = "#44403C"
blueColor = "#1D4ED8"
dataframeBorderColor = "#E7E5E4"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAF9"
